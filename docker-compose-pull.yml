version: "3.9"

services:

  gateway.api:
    image: juancamba/gateway.api:latest
    ports:
      - "5000:8080"
    restart: always

  users.api:
    image: juancamba/users.api:latest
    ports:
      - "5001:8080"
    restart: always

  orders.api:
    image: juancamba/orders.api:latest
    ports:
      - "5002:8080"
    restart: always

  catalog.api:
    image: juancamba/catalog.api:latest
    ports:
      - "5003:8080"
    restart: always

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    command: --interval 30

    restart: always